<div class="scrim scrim-cart" style="z-index:399;"></div>
<aside class="cart-drawer" aria-label="My orders" data-step="review">
  <div class="cart-head">
    <button type="button" class="close-btn cart-back-btn" id="cart-back-btn" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
    </button>
    <h3 class="cart-head-title-review">My Orders</h3>
    <h3 class="cart-head-title-details">Delivery Details</h3>
    <button class="close-btn cart-close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4l16 16M20 4L4 20"/></svg></button>
  </div>

  <div class="cart-items"></div>

  <div class="cart-details-panel">
    <div class="field">
      <label for="co-name">Your name</label>
      <input type="text" id="co-name" placeholder="e.g. Jane Wanjiru">
    </div>
    <div class="field">
      <label for="co-phone">Phone number</label>
      <input type="tel" id="co-phone" inputmode="tel" autocomplete="tel" maxlength="13" placeholder="07XX XXX XXX">
      <span class="field-error" id="co-phone-error">Enter a valid Kenyan mobile number, e.g. 0712 345 678</span>
    </div>
    <div class="field">
      <label for="co-location">Delivery location</label>
      <input type="text" id="co-location" placeholder="e.g. Westlands, Nairobi">
    </div>
    <div class="field">
      <label>Delivery zone</label>
      <!-- Populated by app.js (renderZoneOptions) from ORAIMO_CONFIG.delivery.zones
           in config.js — add, rename, or re-price zones there, not here. -->
      <div class="zone-options"></div>
    </div>
    <p class="delivery-note">Free delivery within Nairobi CBD, within 24 hours. Deliveries outside the CBD attract a flat fee, added to your total below.</p>
  </div>

  <div class="cart-summary">
    <div class="summary-row"><span>Subtotal</span><span class="summary-subtotal">KES 0</span></div>
    <div class="summary-row summary-delivery-row" style="display:none;"><span>Delivery</span><span class="summary-delivery">KES 0</span></div>
    <div class="summary-row total"><span>Total</span><span class="summary-total">KES 0</span></div>

    <button class="btn btn-accent btn-block cart-step-btn-review" id="proceed-checkout-btn">
      Proceed to Checkout
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>

    <button class="btn btn-whatsapp btn-block cart-step-btn-details" id="checkout-btn">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="#fff"><path d="M17 14.3c-.3-.2-1.7-.9-2-1-.3-.1-.5-.1-.6.1-.2.3-.7 1-.9 1.2-.2.2-.3.2-.6.1-.3-.2-1.2-.5-2.3-1.5-.9-.8-1.4-1.7-1.6-2-.2-.3 0-.5.1-.6.1-.1.3-.3.4-.5.1-.1.2-.3.3-.4.1-.2 0-.4 0-.5-.1-.1-.6-1.4-.8-1.9-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.3-.3.3-1 1-1 2.3 0 1.4 1 2.7 1.1 2.9.1.2 2 3.1 4.9 4.3.7.3 1.2.5 1.6.6.7.2 1.3.2 1.8.1.6-.1 1.7-.7 1.9-1.3.2-.6.2-1.2.2-1.3-.1-.1-.3-.2-.5-.3zM12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2z"/></svg>
      Send Order via WhatsApp
    </button>
  </div>
</aside>
